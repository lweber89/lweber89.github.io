<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" role="img" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>geocrime-stl pipeline</title>
<desc>Monthly SLMPD crime data flows through four geocrime-stl stages (fetch, clean, filter, export) into analysis-ready files that power the St. Louis Crime Data Explorer.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7a7a74" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="40" y="30" width="596" height="110" rx="12" fill="none" stroke="#9a9a94" stroke-width="1" stroke-dasharray="4 4"/>
<text x="56" y="47" font-size="12" fill="#7a7a74" dominant-baseline="central">geocrime-stl package</text>

<rect x="56" y="64" width="120" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="116" y="82" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Fetch</text>
<text x="116" y="100" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">Monthly file</text>

<rect x="204" y="64" width="120" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="264" y="82" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Clean</text>
<text x="264" y="100" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">One schema</text>

<rect x="352" y="64" width="120" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="412" y="82" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Filter</text>
<text x="412" y="100" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">Month, city</text>

<rect x="500" y="64" width="120" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="560" y="82" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Export</text>
<text x="560" y="100" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">GIS-ready</text>

<line x1="178" y1="92" x2="202" y2="92" stroke="#7a7a74" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="326" y1="92" x2="350" y2="92" stroke="#7a7a74" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="474" y1="92" x2="498" y2="92" stroke="#7a7a74" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="190" width="160" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="120" y="212" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">SLMPD stats page</text>
<line x1="116" y1="188" x2="116" y2="122" stroke="#7a7a74" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="436" y="190" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="536" y="208" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">Analysis-ready files</text>
<text x="536" y="226" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">GeoJSON, GeoPackage, CSV</text>
<line x1="560" y1="122" x2="560" y2="188" stroke="#7a7a74" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="380" y="296" width="256" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="508" y="318" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">St. Louis Crime Data Explorer</text>
<line x1="536" y1="248" x2="536" y2="294" stroke="#7a7a74" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
